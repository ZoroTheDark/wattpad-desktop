[package]
name = "mi-cliente-wattpad"
version = "0.1.0"
edition = "2021"

[dependencies]
async-compat = "0.2"
chacha20poly1305 = "0.10"
cookie_store = "0.22"
notify-rust = "4.11"
rand = "0.8"
# Usa la misma versión que wp-mini para evitar conflictos de traits
reqwest = { version = "0.13", features = ["cookies", "form", "json"] }
reqwest_cookie_store = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.19"
tokio = { version = "1", features = ["full"] }
wp-mini = "0.2.0-alpha.3"
wry = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
slint-build = "1.19"
